<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تجربة</title><style>body{background:#0B1D3A;color:#fff;font-family:system-ui;text-align:center}button{padding:12px;margin:5px;border-radius:20px;border:0;font-weight:800}.on{background:#FFD700}.k{background:#13294d;margin:10px;padding:15px;border-radius:12px}</style></head><body>
<h2>تجربة ازرار</h2>
<input id="box" placeholder="اكتب ايفون" oninput="go()" style="padding:12px;width:90%;border-radius:20px;border:0;text-align:center">
<p id="num">3 منتج</p>
<button id="bAll" class="on" onclick="setF('all',this)">الكل</button>
<button onclick="setF('phone',this)">تلفونات</button>
<button onclick="setF('shoe',this)">احذية</button>
<div id="list">
<div class="k" data-t="phone">ايفون 15 - iPhone 15</div>
<div class="k" data-t="phone">سامسونج S24</div>
<div class="k" data-t="shoe">حذاء نايك - Nike</div>
</div>
<script>
var F='all';
function setF(t,b){F=t;var all=document.querySelectorAll('button');for(var i=0;i<all.length;i++){all[i].classList.remove('on')}b.classList.add('on');go()}
function go(){var q=document.getElementById('box').value.toLowerCase();var cards=document.querySelectorAll('.k');var c=0;for(var i=0;i<cards.length;i++){var show=(F==='all'||cards[i].getAttribute('data-t')===F)&&cards[i].textContent.toLowerCase().indexOf(q)>-1;cards[i].style.display=show?'block':'none';if(show)c++}document.getElementById('num').innerText=c+' منتج'}
</script></body></html>
